name: Backend CI

on:
  push:
    branches:
      - main
      - upgrade-security
  pull_request:
    branches:
      - main
      - upgrade-security

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, testes e contratos
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sagep
          POSTGRES_PASSWORD: sagep_ci
          POSTGRES_DB: sagep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagep -d sagep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sagep:sagep_ci@localhost:5432/sagep_test?schema=public
      JWT_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PDF_RENDER_MODE: mock
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      CORS_ALLOW_CREDENTIALS: "false"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm run security:audit

      - name: Procurar segredos versionados
        run: npm run security:secrets

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Aplicar migrations no banco de teste
        run: npx prisma migrate deploy

      - name: Compilar TypeScript
        run: npm run build

      - name: Validar OpenAPI
        run: npm run openapi:validate

      - name: Verificar OpenAPI versionado
        run: |
          npm run openapi:export
          git diff --exit-code -- docs/api/openapi/openapi.json

      - name: Verificar tipos TypeScript do OpenAPI
        run: npm run openapi:check-client

      - name: Executar testes
        run: npm test

  docker:
    name: Imagem Docker segura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Construir imagem de produção
        run: docker build --tag sagep-backend:ci .

      - name: Validar entrypoint e usuário da aplicação
        run: |
          docker run --rm --entrypoint sh sagep-backend:ci -c '
            set -eu
            test -x /usr/local/bin/docker-entrypoint.sh
            sh -n /usr/local/bin/docker-entrypoint.sh
            ! grep -q "$(printf "\r")" /usr/local/bin/docker-entrypoint.sh
            test "$(gosu sagep id -u)" -ne 0
            pg_dump --version
            pg_restore --version
          '
