services:
  postgres:
    image: postgres:16
    container_name: sagep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sagep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-sagep}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sagep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sagep_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${DOCKER_NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Defina DOCKER_DATABASE_URL no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com ao menos 32 caracteres no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET diferente com ao menos 32 caracteres}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PDF_TIMEOUT_MS: ${PDF_TIMEOUT_MS:-60000}
      PDF_RENDER_MODE: ${PDF_RENDER_MODE:-real}
      COMPRAS_GOV_DEBUG: ${COMPRAS_GOV_DEBUG:-false}
      PORTAL_TRANSPARENCIA_API_TOKEN: ${PORTAL_TRANSPARENCIA_API_TOKEN:-}
      PORTAL_TRANSPARENCIA_BASE_URL: ${PORTAL_TRANSPARENCIA_BASE_URL:-https://api.portaldatransparencia.gov.br/api-de-dados}
      PORTAL_TRANSPARENCIA_SYNC_INTERVAL_MINUTES: ${PORTAL_TRANSPARENCIA_SYNC_INTERVAL_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-sagep_refresh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      SENSITIVE_RATE_LIMIT_MAX: ${SENSITIVE_RATE_LIMIT_MAX:-20}
      STEP_UP_EXPIRES_IN_SECONDS: ${STEP_UP_EXPIRES_IN_SECONDS:-300}
      HEALTH_PGADMIN_URL: ${HEALTH_PGADMIN_URL:-http://pgadmin/misc/ping}
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      BACKUP_DIRECTORY: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MAX_FILES: ${BACKUP_MAX_FILES:-30}
      BACKUP_SCHEDULE_HOURS: ${BACKUP_SCHEDULE_HOURS:-24}
      BACKUP_RUN_ON_STARTUP: ${BACKUP_RUN_ON_STARTUP:-true}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
    ports:
      - "${API_PORT:-3000}:${PORT:-3000}"
    volumes:
      - sagep_backups:/app/backups
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sagep_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sagep.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Defina PGADMIN_DEFAULT_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

volumes:
  sagep_postgres_data:
    name: sagep_postgres_data
  sagep_backups:
    name: sagep_backups
