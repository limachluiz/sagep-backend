name: ${SAGEP_COMPOSE_PROJECT:-sagep-backend}

services:
  postgres:
    image: postgres:16
    container_name: ${SAGEP_CONTAINER_PREFIX:-sagep}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sagep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-sagep}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sagep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SAGEP_CONTAINER_PREFIX:-sagep}_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${DOCKER_NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Defina DOCKER_DATABASE_URL no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com ao menos 32 caracteres no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET diferente com ao menos 32 caracteres}
      SAGEP_SECRETS_ENCRYPTION_KEY: ${SAGEP_SECRETS_ENCRYPTION_KEY:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PDF_TIMEOUT_MS: ${PDF_TIMEOUT_MS:-60000}
      PDF_RENDER_MODE: ${PDF_RENDER_MODE:-real}
      COMPRAS_GOV_DEBUG: ${COMPRAS_GOV_DEBUG:-false}
      PORTAL_TRANSPARENCIA_API_TOKEN: ${PORTAL_TRANSPARENCIA_API_TOKEN:-}
      PORTAL_TRANSPARENCIA_BASE_URL: ${PORTAL_TRANSPARENCIA_BASE_URL:-https://api.portaldatransparencia.gov.br/api-de-dados}
      PORTAL_TRANSPARENCIA_SYNC_INTERVAL_MINUTES: ${PORTAL_TRANSPARENCIA_SYNC_INTERVAL_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-sagep_refresh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      SENSITIVE_RATE_LIMIT_MAX: ${SENSITIVE_RATE_LIMIT_MAX:-20}
      STEP_UP_EXPIRES_IN_SECONDS: ${STEP_UP_EXPIRES_IN_SECONDS:-300}
      HEALTH_PGADMIN_URL: ${HEALTH_PGADMIN_URL:-http://pgadmin/misc/ping}
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      BACKUP_DIRECTORY: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MAX_FILES: ${BACKUP_MAX_FILES:-30}
      BACKUP_SCHEDULE_HOURS: ${BACKUP_SCHEDULE_HOURS:-24}
      BACKUP_RUN_ON_STARTUP: ${BACKUP_RUN_ON_STARTUP:-true}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      EVIDENCE_DIRECTORY: /app/evidence-files
      EVIDENCE_MAX_UPLOAD_MB: ${EVIDENCE_MAX_UPLOAD_MB:-100}
      DEPLOYMENT_PKI_DIRECTORY: /app/pki
      DEPLOYMENT_TLS_DIRECTORY: /app/tls
      CERTIFICATE_AUTO_RENEW_ENABLED: ${CERTIFICATE_AUTO_RENEW_ENABLED:-true}
      CERTIFICATE_AUTO_RENEW_DAYS: ${CERTIFICATE_AUTO_RENEW_DAYS:-30}
      CERTIFICATE_RENEWAL_CHECK_HOURS: ${CERTIFICATE_RENEWAL_CHECK_HOURS:-24}
      CERTIFICATE_PROXY_AUTO_RELOAD: "true"
      SAGEP_HOSTNAME: ${SAGEP_HOSTNAME:-}
      SAGEP_BIND_IP: ${SAGEP_BIND_IP:-}
      SAGEP_ALLOWED_NETWORKS: ${SAGEP_ALLOWED_NETWORKS:-}
      SAGEP_SETUP_TOKEN: ${SAGEP_SETUP_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${PORT:-3000}"
    volumes:
      - sagep_backups:/app/backups
      - sagep_pki:/app/pki
      - sagep_tls:/app/tls
      - sagep_evidence_files:/app/evidence-files
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ${SAGEP_CONTAINER_PREFIX:-sagep}_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sagep.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Defina PGADMIN_DEFAULT_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

  frontend:
    profiles: ["https"]
    build:
      context: ../sagep-web
      dockerfile: Dockerfile
    container_name: ${SAGEP_CONTAINER_PREFIX:-sagep}_frontend
    restart: unless-stopped
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["https"]
    image: caddy:2.10-alpine
    container_name: ${SAGEP_CONTAINER_PREFIX:-sagep}_proxy
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    environment:
      SAGEP_HOSTNAME: ${SAGEP_HOSTNAME:-localhost}
      CERTIFICATE_RELOAD_CHECK_SECONDS: ${CERTIFICATE_RELOAD_CHECK_SECONDS:-15}
    command: ["/bin/sh", "/etc/caddy/watch-certificates.sh"]
    ports:
      - "${SAGEP_BIND_IP:-127.0.0.1}:${SAGEP_HTTP_PORT:-80}:80"
      - "${SAGEP_BIND_IP:-127.0.0.1}:${SAGEP_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-watch-certificates.sh:/etc/caddy/watch-certificates.sh:ro
      - sagep_tls:/etc/caddy/pki:ro
      - sagep_caddy_data:/data
      - sagep_caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  sagep_postgres_data:
    name: ${SAGEP_VOLUME_PREFIX:-sagep}_postgres_data
  sagep_backups:
    name: ${SAGEP_VOLUME_PREFIX:-sagep}_backups
  sagep_pki:
    name: ${SAGEP_VOLUME_PREFIX:-sagep}_pki
  sagep_tls:
    name: ${SAGEP_VOLUME_PREFIX:-sagep}_tls
  sagep_evidence_files:
    name: ${SAGEP_VOLUME_PREFIX:-sagep}_evidence_files
  sagep_caddy_data:
    name: ${SAGEP_VOLUME_PREFIX:-sagep}_caddy_data
  sagep_caddy_config:
    name: ${SAGEP_VOLUME_PREFIX:-sagep}_caddy_config
