services:
  postgres:
    image: postgres:16
    container_name: sagep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sagep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-sagep}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sagep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sagep_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${DOCKER_NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Defina DOCKER_DATABASE_URL no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque-este-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PDF_TIMEOUT_MS: ${PDF_TIMEOUT_MS:-60000}
      PDF_RENDER_MODE: ${PDF_RENDER_MODE:-real}
      COMPRAS_GOV_DEBUG: ${COMPRAS_GOV_DEBUG:-false}
      PORTAL_TRANSPARENCIA_API_TOKEN: ${PORTAL_TRANSPARENCIA_API_TOKEN:-}
      PORTAL_TRANSPARENCIA_BASE_URL: ${PORTAL_TRANSPARENCIA_BASE_URL:-https://api.portaldatransparencia.gov.br/api-de-dados}
      PORTAL_TRANSPARENCIA_SYNC_INTERVAL_MINUTES: ${PORTAL_TRANSPARENCIA_SYNC_INTERVAL_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      HEALTH_PGADMIN_URL: ${HEALTH_PGADMIN_URL:-http://pgadmin/misc/ping}
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
    ports:
      - "${API_PORT:-3000}:${PORT:-3000}"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sagep_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sagep.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Defina PGADMIN_DEFAULT_PASSWORD no arquivo .env}
    ports:
      - "${PGADMIN_PORT:-5050}:80"

volumes:
  sagep_postgres_data:
    name: sagep_postgres_data
