# Executar fora do host SAGEP. Ajustar o hostname real e o serviço Alertmanager.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: sagep-api
    scheme: https
    metrics_path: /api/health/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/sagep-metrics-token
    static_configs:
      - targets: ["sagep.example.invalid:443"]
