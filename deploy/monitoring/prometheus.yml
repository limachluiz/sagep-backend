global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sagep-api
    metrics_path: /api/health/metrics
    authorization:
      type: Bearer
      credentials: __HEALTH_METRICS_TOKEN__
    static_configs:
      - targets: ["__SAGEP_METRICS_TARGET__"]
